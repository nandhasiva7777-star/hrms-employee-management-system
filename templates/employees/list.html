{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h3>Employees</h3><a href="/employees/add/" class="btn btn-primary">+ Add Employee</a></div><form class="my-3 d-flex gap-2"><input name="q" value="{{q}}" class="form-control" placeholder="Search name..."><button class="btn btn-dark">Search</button></form><table class="table table-striped"><tr><th>ID</th><th>Name</th><th>Dept</th><th>Designation</th><th>Salary</th><th></th></tr>{% for e in employees %}<tr><td>{{e.emp_id}}</td><td>{{e.full_name}}</td><td>{{e.department}}</td><td>{{e.designation}}</td><td>₹{{e.salary}}</td><td><a href="/employees/{{e.pk}}/" class="btn btn-sm btn-outline-primary">View</a></td></tr>{% empty %}<tr><td colspan="6">No employees. Add pannunga.</td></tr>{% endfor %}</table>{% endblock %}
