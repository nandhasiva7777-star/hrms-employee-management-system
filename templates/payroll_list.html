{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h3>Payroll</h3><a href="/payroll/add/" class="btn btn-primary">+ Generate Payroll</a></div><table class="table mt-3"><tr><th>Employee</th><th>Month</th><th>Basic</th><th>Net Pay</th><th></th></tr>{% for p in pays %}<tr><td>{{p.employee.full_name}}</td><td>{{p.month}}</td><td>₹{{p.basic}}</td><td><b>₹{{p.net_pay}}</b></td><td><a href="/payroll/{{p.pk}}/slip/" class="btn btn-sm btn-outline-dark">View Slip</a></td></tr>{% empty %}<tr><td colspan="5">No payroll yet</td></tr>{% endfor %}</table>{% endblock %}
