<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/dashboard/">💼 HRMS</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#n"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="n"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="/employees/">Employees</a></li><li class="nav-item"><a class="nav-link" href="/attendance/">Attendance</a></li><li class="nav-item"><a class="nav-link" href="/leaves/">Leave</a></li><li class="nav-item"><a class="nav-link" href="/payroll/">Payroll</a></li></ul>{% if user.is_authenticated %}<span class="text-white me-3">Hi, {{user.username}} ({{user.role}})</span><a class="btn btn-outline-light btn-sm" href="/logout/">Logout</a>{% endif %}</div></div></nav>
<div class="container py-4">{% if messages %}{% for m in messages %}<div class="alert alert-success">{{m}}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>{% block scripts %}{% endblock %}</body></html>
